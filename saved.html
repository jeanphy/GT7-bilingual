<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratégies sauvegardées · GT7 Endurance</title>
    <meta
      name="description"
      content="Bibliothèque locale de stratégies d’endurance Gran Turismo 7."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/i18n.js"></script>
    <script defer src="./js/logic.js"></script>
    <script defer src="./js/strategy.js"></script>
    <script defer src="./js/saved.js"></script>
  </head>
  <body>
    <header class="topbar no-print">
      <div class="topbar-inner">
        <div class="brand-group">
          <a href="./index.html" id="brand-title" class="brand">GT7 Endurance</a>
          <div class="page-switch">
            <a href="./index.html" class="page-link" data-i18n="navPlannerPage">Planificateur</a>
            <a href="./saved.html" class="page-link active" data-i18n="navSavedPage">Stratégies sauvegardées</a>
          </div>
        </div>
        <div class="toolbar-controls">
          <a href="./index.html" class="btn btn-secondary" data-i18n="backToPlannerBtn">← Retour au planificateur</a>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <div>
          <h1 class="page-title" data-i18n="savedPageLead">Stratégies sauvegardées</h1>
          <p class="page-subtitle" data-i18n="savedPageSub">
            Consultez, recherchez et rechargez vos stratégies enregistrées dans votre navigateur.
          </p>
        </div>

        <div class="toolbar-controls">
          <div id="lang-switch" class="segmented" role="group">
            <button type="button" data-lang="fr" class="active">FR</button>
            <button type="button" data-lang="en">EN</button>
          </div>

          <div id="theme-switch" class="segmented" role="group">
            <button type="button" data-theme="dark" class="active" data-i18n="themeDark">Sombre</button>
            <button type="button" data-theme="light" data-i18n="themeLight">Clair</button>
          </div>
        </div>
      </div>

      <div class="stack">
        <!-- Search Toolbar -->
        <section class="saved-toolbar">
          <div class="saved-search-wrap">
            <input id="saved-search-input" type="search" class="input" />
          </div>
        </section>

        <div id="saved-feedback" class="inline-feedback hidden" role="status"></div>

        <!-- Cards Container -->
        <div id="saved-strategies-list"></div>
      </div>
    </main>
  </body>
</html>
